# Primary configuration: ESP32-WROVER-E / -IE DevKit over Wi-Fi

substitutions:
  name: bluespin-esp32
  friendly_name: BlueSpin ESP32

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp-wrover-kit
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [bt_a2dp_sink]

packages:
  base: !include common/bluespin-base.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Disable Wi-Fi power saving for consistent Bluetooth + Sendspin streaming latency
  power_save_mode: none
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret ap_fallback_password

captive_portal:

# Optional physical BOOT button (GPIO0) opens the pinless Bluetooth pairing window
binary_sensor:
  - platform: gpio
    name: "Boot button (pair)"
    internal: true
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      - bt_a2dp_sink.start_pairing: bt

sensor:
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 30s
    entity_category: diagnostic
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 5

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 6
    ssid:
      name: "Connected SSID"
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 7
